name: "✨ 功能请求"
description: 建议新功能或改进。
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议！提交前请考虑：

        - **搜索 [现有 issues](https://github.com/zhuxixi/jfox/issues)** — 可能有人已经提过类似建议。

  - type: textarea
    id: problem
    attributes:
      label: 问题或使用场景
      description: 这个功能解决什么问题？你目前想做什么但做不到？
      placeholder: |
        我想用 jfox 做... 但目前没有方法...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你认为应该怎么实现？尽可能具体 — CLI 参数、配置选项、交互行为。
      placeholder: |
        添加 `--foo` 参数到 `jfox search` 命令...
        或：新增配置项 `bar.baz` 控制...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过其他方法吗？为什么建议方案更好？

  - type: dropdown
    id: type
    attributes:
      label: 功能类型
      options:
        - 新 CLI 命令
        - 现有命令改进
        - 笔记类型扩展
        - 搜索/索引改进
        - 知识图谱改进
        - 守护进程/后端改进
        - 配置/安装改进
        - 性能优化
        - 开发者体验（测试、文档、CI）
        - 其他
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 范围
      description: 这个改动有多大？
      options:
        - 小（单个文件，< 50 行）
        - 中（几个文件，< 300 行）
        - 大（新模块或重大重构）

  - type: checkboxes
    id: pr-ready
    attributes:
      label: 贡献
      options:
        - label: 我想自己实现并提交 PR
